[package]
name = "snapshotstore"
description = "Transactional append-only tables over immutable Parquet files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
s3-check = ["dep:object_store"]

[[example]]
name = "s3_conditional_writes"
required-features = ["s3-check"]

[dependencies]
async-trait.workspace = true
arrow.workspace = true
bytes.workspace = true
clap.workspace = true
fs4.workspace = true
object_store = { version = "=0.14.2", default-features = false, features = ["aws"], optional = true }
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "=0.1.5"
tempfile.workspace = true
