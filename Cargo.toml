[workspace]
members = ["crates/snapshotstore"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["AnujDakhara7888"]
repository = "https://github.com/AnujDakhara7888/SnapshotStore"

[workspace.dependencies]
async-trait = "=0.1.92"
arrow = { version = "=60.1.0", default-features = false }
bytes = "=1.12.1"
fs4 = "=1.1.0"
parquet = { version = "=60.1.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
uuid = { version = "=1.29.0", features = ["serde", "v4"] }
